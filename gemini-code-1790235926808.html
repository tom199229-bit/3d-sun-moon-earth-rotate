<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 針對手機與各式裝置設定 viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>3D 地球公轉、黃赤交角、晝夜變化與月相模擬器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        /* 使用 dvh 確保手機瀏覽器網址列伸縮時畫面不變形 */
        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #030712;
            color: #f3f4f6;
            font-family: 'PingFang TC', 'Microsoft JhengHei', system-ui, -apple-system, sans-serif;
            position: relative;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: #000000;
        }

        /* --------------------------------------------------
         * 收合按鈕 (最高優先權 z-index: 9999，確保手機端絕對看得到)
         * -------------------------------------------------- */
        .panel-toggle-btn {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top));
            right: calc(12px + env(safe-area-inset-right));
            z-index: 9999;
            background: #0284c7;
            color: #ffffff;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.88rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6), 0 0 10px rgba(56, 189, 248, 0.4);
            transition: all 0.25s ease;
        }
        .panel-toggle-btn:active { transform: scale(0.95); }

        /* --------------------------------------------------
         * 右側控制面板 - 玻璃擬物風
         * -------------------------------------------------- */
        .control-panel {
            position: fixed;
            right: 0;
            top: 0;
            height: 100%;
            height: 100dvh;
            width: 320px;
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-left: 1px solid rgba(56, 189, 248, 0.25);
            padding: 20px 16px;
            padding-top: calc(60px + env(safe-area-inset-top)); /* 預留上方按鈕空間 */
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
            overflow-y: auto;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -8px 0 32px rgba(0,0,0,0.8);
        }
        .control-panel.collapsed {
            transform: translateX(100%);
        }

        .panel-header { border-bottom: 1px solid rgba(255, 255, 255, 0.12); padding-bottom: 8px; }
        .panel-header h2 { font-size: 1.05rem; font-weight: 700; color: #38bdf8; }

        .section-title { font-size: 0.82rem; font-weight: 600; color: #7dd3fc; margin-top: 4px; display: flex; align-items: center; gap: 6px; }

        .control-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.78rem; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; }
        .val-badge { background: #1e293b; color: #38bdf8; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; border: 1px solid rgba(56,189,248,0.2); }
        input[type="range"] { width: 100%; accent-color: #38bdf8; cursor: pointer; height: 20px; }

        .btn-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .btn-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .btn-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }

        button.action-btn {
            background: #1e293b; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.12);
            padding: 8px 6px; border-radius: 6px; cursor: pointer; font-size: 0.78rem;
            font-weight: 500; transition: all 0.2s ease; text-align: center;
        }
        button.action-btn:hover { background: #334155; border-color: #38bdf8; color: #fff; }
        button.action-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; font-weight: bold; box-shadow: 0 0 10px rgba(56,189,248,0.3); }

        .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; color: #cbd5e1; cursor: pointer; padding: 2px 0; }
        .toggle-row input { cursor: pointer; width: 18px; height: 18px; accent-color: #38bdf8; }

        /* 左上角標題卡 */
        .info-overlay {
            position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(56,189,248,0.2);
            pointer-events: none; z-index: 10; max-width: calc(100% - 160px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .info-overlay h1 { font-size: 0.95rem; color: #f8fafc; margin-bottom: 2px; }
        .info-overlay p { font-size: 0.72rem; color: #94a3b8; line-height: 1.2; }

        /* 月相 PIP 小視窗 */
        .moon-pip-window {
            position: fixed; bottom: 16px; right: 335px; width: 180px; height: 220px;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(56,189,248,0.3);
            border-radius: 12px; z-index: 10; display: flex; flex-direction: column;
            align-items: center; padding: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }
        .moon-pip-window.hidden { opacity: 0; pointer-events: none; transform: scale(0.9); }

        /* 地球晝夜視角 PIP 視窗 */
        .earth-pip-window {
            position: fixed; bottom: 16px; left: 16px; width: 240px; height: 280px;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(56,189,248,0.3);
            border-radius: 12px; z-index: 10; display: flex; flex-direction: column;
            align-items: center; padding: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }
        .earth-pip-window.hidden { opacity: 0; pointer-events: none; transform: scale(0.9); }

        .pip-header { font-size: 0.78rem; font-weight: bold; color: #38bdf8; margin-bottom: 6px; display: flex; justify-content: space-between; width: 100%; }
        #moon-pip-canvas { width: 100px; height: 100px; border-radius: 50%; background: #000; }
        #earth-pip-canvas { width: 220px; height: 140px; border-radius: 8px; background: #000; }
        
        .pip-status { margin-top: 4px; text-align: center; width: 100%; }
        .pip-lunar-date { font-size: 0.88rem; font-weight: bold; color: #fef08a; }
        .pip-phase-desc { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }
        .pip-controls { width: 100%; margin-top: 4px; }

        /* --------------------------------------------------
         * 響應式適應 (RWD)：手機與平板螢幕 (<= 768px)
         * -------------------------------------------------- */
        @media (max-width: 768px) {
            /* 控制面板改為高覆蓋浮層 */
            .control-panel {
                width: 85%;
                max-width: 320px;
            }

            /* 手機端按鈕加大點擊範圍並固定在右上角 */
            .panel-toggle-btn {
                top: calc(10px + env(safe-area-inset-top));
                right: calc(10px + env(safe-area-inset-right));
                padding: 10px 16px;
                font-size: 0.9rem;
            }

            /* 左上角標題簡化 */
            .info-overlay {
                max-width: 55%;
                padding: 8px 10px;
            }
            .info-overlay h1 { font-size: 0.82rem; }
            .info-overlay p { font-size: 0.65rem; }

            /* 縮小並調離底部，避免重疊 */
            .earth-pip-window {
                left: 10px;
                bottom: 10px;
                width: 170px;
                height: 220px;
            }
            #earth-pip-canvas { width: 150px; height: 100px; }

            .moon-pip-window {
                right: 10px;
                bottom: 10px;
                width: 130px;
                height: 175px;
            }
            #moon-pip-canvas { width: 75px; height: 75px; }
            .pip-lunar-date { font-size: 0.75rem; }
            .pip-phase-desc { font-size: 0.65rem; }
        }
    </style>

    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- 強制最高層級收合/展開按鈕 -->
    <button class="panel-toggle-btn" id="btn-toggle-panel">
        <span id="toggle-icon">◀</span>
        <span id="toggle-text">選單</span>
    </button>

    <div id="canvas-container">
        <div class="info-overlay">
            <h1>☀️ 3D 天體運行模擬器</h1>
            <p>黃赤交角 23.5° | 月球黃白交角 5.14°</p>
        </div>
    </div>

    <!-- 左下角：地球視野 PIP 小視窗 -->
    <div class="earth-pip-window" id="earth-pip-window">
        <div class="pip-header">
            <span>🌍 地球同步視角</span>
            <span id="earth-pip-close-btn" style="cursor:pointer; color:#94a3b8;">✕</span>
        </div>
        <canvas id="earth-pip-canvas"></canvas>
        <div class="pip-controls">
            <div class="btn-grid-3">
                <button class="action-btn view-btn" data-view="north">北緯</button>
                <button class="action-btn view-btn active" data-view="equator">赤道</button>
                <button class="action-btn view-btn" data-view="south">南緯</button>
            </div>
        </div>
        <div class="pip-status">
            <div class="pip-phase-desc" id="season-desc-text">直射：赤道 (春分)</div>
        </div>
    </div>

    <!-- 右下角：月相盈虧 PIP 小視窗 -->
    <div class="moon-pip-window" id="moon-pip-window">
        <div class="pip-header">
            <span>🌙 地球觀測月相</span>
            <span id="pip-close-btn" style="cursor:pointer; color:#94a3b8;">✕</span>
        </div>
        <canvas id="moon-pip-canvas"></canvas>
        <div class="pip-status">
            <div class="pip-lunar-date" id="lunar-date-text">農曆 初一</div>
            <div class="pip-phase-desc" id="lunar-phase-desc">新月 (朔) | 0%</div>
        </div>
    </div>

    <!-- 右側控制面板 -->
    <div class="control-panel" id="control-panel">
        <div class="panel-header">
            <h2>天體運行模擬控制</h2>
        </div>

        <div class="section-title">1. 動畫播放與速度</div>
        <div class="btn-grid-2">
            <button id="btn-play-pause" class="action-btn active">暫停 / Pause</button>
            <button id="btn-reset-cam" class="action-btn">重置視角</button>
        </div>
        <div class="control-group">
            <label>模擬時間流動速度: <span class="val-badge" id="speed-val">1.0x</span></label>
            <input type="range" id="speed-slider" min="0" max="5" value="1" step="0.1">
        </div>

        <div class="section-title">2. 四節氣快速定位</div>
        <div class="btn-grid-4">
            <button id="btn-spring" class="action-btn">春分</button>
            <button id="btn-summer" class="action-btn">夏至</button>
            <button id="btn-autumn" class="action-btn">秋分</button>
            <button id="btn-winter" class="action-btn">冬至</button>
        </div>

        <div class="section-title">3. 同步衛星觀察視角</div>
        <div class="btn-grid-3">
            <button class="action-btn view-btn" data-view="north">北緯 45°</button>
            <button class="action-btn view-btn active" data-view="equator">赤道</button>
            <button class="action-btn view-btn" data-view="south">南緯 45°</button>
        </div>

        <div class="section-title">4. 顯示與輔助線設定</div>
        <label class="toggle-row">
            <span>顯示地球晝夜視角視窗</span>
            <input type="checkbox" id="chk-show-earth-pip" checked>
        </label>
        <label class="toggle-row">
            <span>顯示月球 (Moon)</span>
            <input type="checkbox" id="chk-show-moon" checked>
        </label>
        <label class="toggle-row">
            <span>顯示月相小視窗 (PIP)</span>
            <input type="checkbox" id="chk-show-pip" checked>
        </label>
        <label class="toggle-row">
            <span>地球 23.5° 地軸 (Axis)</span>
            <input type="checkbox" id="chk-earth-axis" checked>
        </label>
        <label class="toggle-row">
            <span>黃道面 (Ecliptic Plane)</span>
            <input type="checkbox" id="chk-ecliptic" checked>
        </label>
        <label class="toggle-row">
            <span>赤道面 (Equatorial Plane)</span>
            <input type="checkbox" id="chk-equator" checked>
        </label>
        <label class="toggle-row">
            <span>月球公轉軌道 (5° 傾角)</span>
            <input type="checkbox" id="chk-moon-orbit" checked>
        </label>
    </div>

    <script>
        const AXIAL_TILT = 23.44 * (Math.PI / 180);
        const MOON_INCLINATION = 5.14 * (Math.PI / 180);
        const EARTH_ORBIT_RADIUS = 55;
        const MOON_ORBIT_RADIUS = 9;

        const PERIOD_EARTH_ROTATION = 1.0;
        const PERIOD_MOON_ORBIT = 27.32;
        const PERIOD_EARTH_ORBIT = 365.2564;

        const OMEGA_EARTH_ROT = (2 * Math.PI) / PERIOD_EARTH_ROTATION;
        const OMEGA_MOON_ORBIT = (2 * Math.PI) / PERIOD_MOON_ORBIT;
        const OMEGA_EARTH_ORBIT = (2 * Math.PI) / PERIOD_EARTH_ORBIT;

        const state = {
            isPlaying: true,
            speed: 1.0,
            earthOrbitAngle: Math.PI / 2,
            earthRotationAngle: 0,
            moonRelativeAngle: 0,
            pipViewMode: 'equator',
            showEarthPIP: true,
            showMoon: true,
            showPIP: true,
            showAxis: true,
            showEcliptic: true,
            showEquator: true,
            showMoonOrbit: true
        };

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 65, 110);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // PIP 子視窗 Renderers
        const pipCanvas = document.getElementById('moon-pip-canvas');
        const pipRenderer = new THREE.WebGLRenderer({ canvas: pipCanvas, antialias: true });
        pipRenderer.setSize(100, 100);
        const pipCamera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);

        const earthPipCanvas = document.getElementById('earth-pip-canvas');
        const earthPipRenderer = new THREE.WebGLRenderer({ canvas: earthPipCanvas, antialias: true });
        earthPipRenderer.setSize(220, 140);
        const earthPipCamera = new THREE.PerspectiveCamera(35, 220 / 140, 0.1, 200);

        // 背景星空
        (function createStarfield() {
            const starGeo = new THREE.BufferGeometry();
            const count = 2500;
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i++) pos[i] = (Math.random() - 0.5) * 600;
            starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.8 })));
        })();

        // 光源
        const sunLight = new THREE.PointLight(0xffffff, 2.2, 400);
        sunLight.castShadow = true;
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x222233, 0.25));

        // 貼圖生成
        function generateSunTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(128, 128, 5, 128, 128, 128);
            grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.2, '#fef08a'); grad.addColorStop(0.6, '#f97316'); grad.addColorStop(1, '#dc2626');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 256, 256);
            return new THREE.CanvasTexture(canvas);
        }

        function generateEarthTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1e3a8a'; ctx.fillRect(0, 0, 512, 256);
            ctx.fillStyle = '#15803d';
            for (let i = 0; i < 30; i++) {
                ctx.beginPath(); ctx.arc(Math.random() * 512, Math.random() * 256, 15 + Math.random() * 45, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = 'rgba(56, 189, 248, 0.5)'; ctx.fillRect(0, 127, 512, 2);
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 512, 15); ctx.fillRect(0, 241, 512, 15);
            return new THREE.CanvasTexture(canvas);
        }

        function generateMoonTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#94a3b8'; ctx.fillRect(0, 0, 256, 128);
            ctx.fillStyle = '#64748b';
            for (let i = 0; i < 40; i++) {
                ctx.beginPath(); ctx.arc(Math.random() * 256, Math.random() * 128, 2 + Math.random() * 8, 0, Math.PI * 2); ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        // 天體建立
        const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(7, 32, 32), new THREE.MeshBasicMaterial({ map: generateSunTexture() }));
        scene.add(sunMesh);

        const earthSystemGroup = new THREE.Group();
        scene.add(earthSystemGroup);

        const earthTiltGroup = new THREE.Group();
        earthTiltGroup.rotation.z = -AXIAL_TILT;
        earthSystemGroup.add(earthTiltGroup);

        const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(3.2, 32, 32), new THREE.MeshStandardMaterial({ map: generateEarthTexture(), roughness: 0.6 }));
        earthMesh.castShadow = true; earthMesh.receiveShadow = true;
        earthTiltGroup.add(earthMesh);

        const moonSystemGroup = new THREE.Group();
        moonSystemGroup.rotation.z = MOON_INCLINATION;
        earthSystemGroup.add(moonSystemGroup);

        const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(0.85, 32, 32), new THREE.MeshStandardMaterial({ map: generateMoonTexture(), roughness: 0.8 }));
        moonMesh.castShadow = true; moonMesh.receiveShadow = true;
        moonSystemGroup.add(moonMesh);

        // 輔助線
        const earthAxisLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -7, 0), new THREE.Vector3(0, 7, 0)]), new THREE.LineBasicMaterial({ color: 0xef4444 }));
        earthTiltGroup.add(earthAxisLine);

        const equatorMesh = new THREE.Mesh(new THREE.RingGeometry(3.22, 5.5, 32), new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.35 }));
        equatorMesh.rotation.x = Math.PI / 2;
        earthTiltGroup.add(equatorMesh);

        const eclipticMesh = new THREE.Mesh(new THREE.RingGeometry(0.1, EARTH_ORBIT_RADIUS + 5, 64), new THREE.MeshBasicMaterial({ color: 0xeab308, side: THREE.DoubleSide, transparent: true, opacity: 0.08 }));
        eclipticMesh.rotation.x = Math.PI / 2;
        scene.add(eclipticMesh);

        const orbitPoints = new THREE.EllipseCurve(0, 0, EARTH_ORBIT_RADIUS, EARTH_ORBIT_RADIUS, 0, 2 * Math.PI).getPoints(128);
        scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(orbitPoints.map(p => new THREE.Vector3(p.x, 0, p.y))), new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4 })));

        const moonOrbitPoints = new THREE.EllipseCurve(0, 0, MOON_ORBIT_RADIUS, MOON_ORBIT_RADIUS, 0, 2 * Math.PI).getPoints(64);
        const moonOrbitLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(moonOrbitPoints.map(p => new THREE.Vector3(p.x, 0, p.y))), new THREE.LineBasicMaterial({ color: 0xfef08a, transparent: true, opacity: 0.6 }));
        moonSystemGroup.add(moonOrbitLine);

        function updateMoonPIP() {
            if (!state.showPIP || !state.showMoon) return;
            let phaseAngle = state.moonRelativeAngle % (2 * Math.PI);
            if (phaseAngle < 0) phaseAngle += 2 * Math.PI;

            const lunarDayNum = Math.floor((phaseAngle / (2 * Math.PI)) * 29.53) + 1;
            const illuminatedPct = Math.round((1 - Math.cos(phaseAngle)) / 2 * 100);

            document.getElementById('lunar-date-text').innerText = `農曆 第 ${lunarDayNum} 天`;
            document.getElementById('lunar-phase-desc').innerText = `照亮 ${illuminatedPct}%`;

            const moonPos = new THREE.Vector3(), earthPos = new THREE.Vector3();
            moonMesh.getWorldPosition(moonPos);
            earthMesh.getWorldPosition(earthPos);

            pipCamera.position.copy(earthPos);
            pipCamera.lookAt(moonPos);
            pipRenderer.render(scene, pipCamera);
        }

        function updateEarthPIP() {
            if (!state.showEarthPIP) return;
            const dist = 12;
            const sin45 = Math.sin(Math.PI / 4) * dist;
            const cos45 = Math.cos(Math.PI / 4) * dist;

            let satLocalPos = new THREE.Vector3(0, 0, dist);
            if (state.pipViewMode === 'north') satLocalPos.set(0, sin45, cos45);
            else if (state.pipViewMode === 'south') satLocalPos.set(0, -sin45, cos45);

            const satWorldPos = satLocalPos.applyMatrix4(earthMesh.matrixWorld);
            const earthCenterWorldPos = new THREE.Vector3(0, 0, 0).applyMatrix4(earthMesh.matrixWorld);
            const upVector = new THREE.Vector3(0, 1, 0).applyQuaternion(earthMesh.getWorldQuaternion(new THREE.Quaternion()));

            earthPipCamera.position.copy(satWorldPos);
            earthPipCamera.up.copy(upVector);
            earthPipCamera.lookAt(earthCenterWorldPos);
            earthPipRenderer.render(scene, earthPipCamera);
        }

        // 互動選單按鈕控制
        const panel = document.getElementById('control-panel');
        const toggleBtn = document.getElementById('btn-toggle-panel');
        let isCollapsed = false;

        toggleBtn.addEventListener('click', () => {
            isCollapsed = !isCollapsed;
            panel.classList.toggle('collapsed', isCollapsed);
            document.getElementById('toggle-icon').innerText = isCollapsed ? '⚙️' : '◀';
            document.getElementById('toggle-text').innerText = isCollapsed ? '選單' : '收合';
        });

        document.getElementById('btn-play-pause').addEventListener('click', (e) => {
            state.isPlaying = !state.isPlaying;
            e.target.innerText = state.isPlaying ? '暫停 / Pause' : '播放 / Play';
        });

        document.getElementById('btn-reset-cam').addEventListener('click', () => {
            camera.position.set(0, 65, 110);
            controls.target.set(0, 0, 0);
            controls.update();
        });

        document.getElementById('speed-slider').addEventListener('input', (e) => {
            state.speed = parseFloat(e.target.value);
            document.getElementById('speed-val').innerText = `${state.speed.toFixed(1)}x`;
        });

        document.getElementById('btn-spring').addEventListener('click', () => state.earthOrbitAngle = Math.PI / 2);
        document.getElementById('btn-summer').addEventListener('click', () => state.earthOrbitAngle = Math.PI);
        document.getElementById('btn-autumn').addEventListener('click', () => state.earthOrbitAngle = (3 * Math.PI) / 2);
        document.getElementById('btn-winter').addEventListener('click', () => state.earthOrbitAngle = 0);

        const viewBtns = document.querySelectorAll('.view-btn');
        viewBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const targetView = e.target.getAttribute('data-view');
                state.pipViewMode = targetView;
                viewBtns.forEach(b => b.classList.toggle('active', b.getAttribute('data-view') === targetView));
            });
        });

        document.getElementById('chk-show-earth-pip').addEventListener('change', (e) => {
            state.showEarthPIP = e.target.checked;
            document.getElementById('earth-pip-window').classList.toggle('hidden', !e.target.checked);
        });
        document.getElementById('earth-pip-close-btn').addEventListener('click', () => {
            state.showEarthPIP = false;
            document.getElementById('chk-show-earth-pip').checked = false;
            document.getElementById('earth-pip-window').classList.add('hidden');
        });

        document.getElementById('chk-show-moon').addEventListener('change', (e) => {
            state.showMoon = e.target.checked;
            moonMesh.visible = e.target.checked;
            moonOrbitLine.visible = e.target.checked && state.showMoonOrbit;
        });

        document.getElementById('chk-show-pip').addEventListener('change', (e) => {
            state.showPIP = e.target.checked;
            document.getElementById('moon-pip-window').classList.toggle('hidden', !e.target.checked);
        });
        document.getElementById('pip-close-btn').addEventListener('click', () => {
            state.showPIP = false;
            document.getElementById('chk-show-pip').checked = false;
            document.getElementById('moon-pip-window').classList.add('hidden');
        });

        document.getElementById('chk-earth-axis').addEventListener('change', (e) => earthAxisLine.visible = e.target.checked);
        document.getElementById('chk-ecliptic').addEventListener('change', (e) => eclipticMesh.visible = e.target.checked);
        document.getElementById('chk-equator').addEventListener('change', (e) => equatorMesh.visible = e.target.checked);
        document.getElementById('chk-moon-orbit').addEventListener('change', (e) => moonOrbitLine.visible = e.target.checked);

        // 自適應視窗大小改變 (RWD Canvas Resize)
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (state.isPlaying) {
                const simDaysPassed = delta * 5.0 * state.speed;
                state.earthOrbitAngle += OMEGA_EARTH_ORBIT * simDaysPassed;
                state.earthRotationAngle += OMEGA_EARTH_ROT * simDaysPassed;
                state.moonRelativeAngle += (OMEGA_MOON_ORBIT - OMEGA_EARTH_ORBIT) * simDaysPassed;
            }

            earthSystemGroup.position.x = Math.cos(state.earthOrbitAngle) * EARTH_ORBIT_RADIUS;
            earthSystemGroup.position.z = Math.sin(state.earthOrbitAngle) * EARTH_ORBIT_RADIUS;
            earthMesh.rotation.y = state.earthRotationAngle;

            if (state.showMoon) {
                const moonAbsoluteAngle = state.earthOrbitAngle + Math.PI + state.moonRelativeAngle;
                moonMesh.position.x = Math.cos(moonAbsoluteAngle) * MOON_ORBIT_RADIUS;
                moonMesh.position.z = Math.sin(moonAbsoluteAngle) * MOON_ORBIT_RADIUS;
            }

            updateMoonPIP();
            updateEarthPIP();

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
