<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 地球公轉、黃赤交角、晝夜變化與月相模擬器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', system-ui, -apple-system, sans-serif; background: #030712; color: #f3f4f6; overflow: hidden; height: 100vh; width: 100vw; display: flex; position: relative; }
        
        #canvas-container { flex: 1; height: 100%; position: relative; background: #000000; width: 100%; }

        /* 右側控制面板 - 深色玻璃擬物風 */
        .control-panel {
            position: absolute; right: 0; top: 0; height: 100%; width: 330px;
            background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); border-left: 1px solid rgba(56, 189, 248, 0.2);
            padding: 18px; display: flex; flex-direction: column; gap: 12px;
            z-index: 20; overflow-y: auto; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -8px 0 32px rgba(0,0,0,0.8);
        }
        .control-panel.collapsed { transform: translateX(100%); }

        /* Panel 開關按鈕 */
        .panel-toggle-btn {
            position: fixed; top: 16px; right: 16px; z-index: 30;
            background: rgba(14, 165, 233, 0.9); color: #ffffff; border: 1px solid #38bdf8;
            border-radius: 8px; padding: 8px 14px; font-size: 0.88rem; font-weight: 600;
            display: flex; align-items: center; gap: 6px; cursor: pointer;
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4); transition: all 0.2s ease;
        }
        .panel-toggle-btn:hover { background: #0284c7; transform: translateY(-1px); }

        .panel-header { border-bottom: 1px solid rgba(255, 255, 255, 0.12); padding-bottom: 8px; }
        .panel-header h2 { font-size: 1.1rem; font-weight: 700; color: #38bdf8; }

        .section-title { font-size: 0.85rem; font-weight: 600; color: #7dd3fc; margin-top: 4px; display: flex; align-items: center; gap: 6px; }

        .control-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.8rem; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; }
        .val-badge { background: #1e293b; color: #38bdf8; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.78rem; border: 1px solid rgba(56,189,248,0.2); }
        input[type="range"] { width: 100%; accent-color: #38bdf8; cursor: pointer; }

        .btn-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .btn-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        .btn-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }

        button.action-btn {
            background: #1e293b; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.12);
            padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 0.78rem;
            font-weight: 500; transition: all 0.2s ease; text-align: center;
        }
        button.action-btn:hover { background: #334155; border-color: #38bdf8; color: #fff; }
        button.action-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; font-weight: bold; box-shadow: 0 0 10px rgba(56,189,248,0.3); }

        .toggle-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; color: #cbd5e1; cursor: pointer; }
        .toggle-row input { cursor: pointer; width: 15px; height: 15px; accent-color: #38bdf8; }

        /* 左上角標題卡 */
        .info-overlay {
            position: absolute; top: 16px; left: 16px;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 18px; border-radius: 10px; border: 1px solid rgba(56,189,248,0.2);
            pointer-events: none; z-index: 5; max-width: calc(100% - 380px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .info-overlay h1 { font-size: 1.1rem; color: #f8fafc; margin-bottom: 2px; }
        .info-overlay p { font-size: 0.78rem; color: #94a3b8; line-height: 1.3; }

        /* 右下角月相盈虧 PIP 小視窗 */
        .moon-pip-window {
            position: absolute; bottom: 20px; right: 350px; width: 190px; height: 230px;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(56,189,248,0.3);
            border-radius: 12px; z-index: 15; display: flex; flex-direction: column;
            align-items: center; padding: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .moon-pip-window.hidden { opacity: 0; pointer-events: none; transform: scale(0.9); }

        /* 左下角地球晝夜視角大型 PIP 視窗 */
        .earth-pip-window {
            position: absolute; bottom: 20px; left: 20px; width: 280px; height: 325px;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(56,189,248,0.3);
            border-radius: 12px; z-index: 15; display: flex; flex-direction: column;
            align-items: center; padding: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .earth-pip-window.hidden { opacity: 0; pointer-events: none; transform: scale(0.9); }

        .pip-header { font-size: 0.82rem; font-weight: bold; color: #38bdf8; margin-bottom: 6px; display: flex; justify-content: space-between; width: 100%; }
        #moon-pip-canvas { width: 120px; height: 120px; border-radius: 50%; background: #000; box-shadow: inset 0 0 10px rgba(255,255,255,0.1); }
        #earth-pip-canvas { width: 260px; height: 190px; border-radius: 8px; background: #000; }
        
        .pip-status { margin-top: 6px; text-align: center; width: 100%; }
        .pip-lunar-date { font-size: 0.95rem; font-weight: bold; color: #fef08a; }
        .pip-phase-desc { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }

        .pip-controls { width: 100%; margin-top: 6px; }

        @media (max-width: 900px) {
            .moon-pip-window { right: 16px; bottom: 80px; width: 150px; height: 190px; }
            .earth-pip-window { left: 16px; bottom: 80px; width: 220px; height: 270px; }
            #moon-pip-canvas { width: 90px; height: 90px; }
            #earth-pip-canvas { width: 200px; height: 130px; }
            .info-overlay { max-width: calc(100% - 100px); }
        }
    </style>

    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <button class="panel-toggle-btn" id="btn-toggle-panel">
        <span id="toggle-icon">◀</span>
        <span id="toggle-text">收合控制選單</span>
    </button>

    <div id="canvas-container">
        <div class="info-overlay">
            <h1>☀️ 地球公轉、黃赤交角、晝夜與月相模擬器</h1>
            <p>黃赤交角 23.5° | 月球黃白交角 5.14° | 真實週期速度比率模擬</p>
        </div>
    </div>

    <!-- 左下角：地球視野（同步衛星視角）PIP 小視窗 -->
    <div class="earth-pip-window" id="earth-pip-window">
        <div class="pip-header">
            <span>🌍 地球衛星同步視角</span>
            <span id="earth-pip-close-btn" style="cursor:pointer; color:#94a3b8;">✕</span>
        </div>
        <canvas id="earth-pip-canvas"></canvas>
        
        <!-- PIP 視窗內的切換按鈕 -->
        <div class="pip-controls">
            <div class="btn-grid-3">
                <button class="action-btn view-btn" data-view="north">北緯 45°</button>
                <button class="action-btn view-btn active" data-view="equator">赤道</button>
                <button class="action-btn view-btn" data-view="south">南緯 45°</button>
            </div>
        </div>

        <div class="pip-status">
            <div class="pip-phase-desc" id="season-desc-text">太陽直射位置：赤道 (春分)</div>
        </div>
    </div>

    <!-- 右下角：月相盈虧 PIP 小視窗 -->
    <div class="moon-pip-window" id="moon-pip-window">
        <div class="pip-header">
            <span>🌙 地球觀測月相</span>
            <span id="pip-close-btn" style="cursor:pointer; color:#94a3b8;">✕</span>
        </div>
        <canvas id="moon-pip-canvas"></canvas>
        <div class="pip-status">
            <div class="pip-lunar-date" id="lunar-date-text">農曆 初一</div>
            <div class="pip-phase-desc" id="lunar-phase-desc">新月 (朔) | 照亮 0%</div>
        </div>
    </div>

    <!-- 右側控制面板 -->
    <div class="control-panel" id="control-panel">
        <div class="panel-header">
            <h2>天體運行模擬控制</h2>
        </div>

        <div class="section-title">1. 動畫播放與速度</div>
        <div class="btn-grid-2">
            <button id="btn-play-pause" class="action-btn active">暫停 / Pause</button>
            <button id="btn-reset-cam" class="action-btn">重置主視角</button>
        </div>
        <div class="control-group">
            <label>模擬時間流動速度: <span class="val-badge" id="speed-val">1.0x</span></label>
            <input type="range" id="speed-slider" min="0" max="5" value="1" step="0.1">
        </div>

        <div class="section-title">2. 四節氣快速定位 (黃赤交角幾何)</div>
        <div class="btn-grid-4">
            <button id="btn-spring" class="action-btn">春分</button>
            <button id="btn-summer" class="action-btn">夏至</button>
            <button id="btn-autumn" class="action-btn">秋分</button>
            <button id="btn-winter" class="action-btn">冬至</button>
        </div>

        <div class="section-title">3. 同步衛星觀察視角</div>
        <div class="btn-grid-3">
            <button class="action-btn view-btn" data-view="north">北緯 45°</button>
            <button class="action-btn view-btn active" data-view="equator">赤道</button>
            <button class="action-btn view-btn" data-view="south">南緯 45°</button>
        </div>

        <div class="section-title">4. 顯示與輔助線設定</div>
        <label class="toggle-row">
            <span>顯示地球晝夜視角視窗</span>
            <input type="checkbox" id="chk-show-earth-pip" checked>
        </label>
        <label class="toggle-row">
            <span>顯示月球 (Moon)</span>
            <input type="checkbox" id="chk-show-moon" checked>
        </label>
        <label class="toggle-row">
            <span>顯示月相小視窗 (PIP)</span>
            <input type="checkbox" id="chk-show-pip" checked>
        </label>
        <label class="toggle-row">
            <span>地球 23.5° 地軸 (Axis)</span>
            <input type="checkbox" id="chk-earth-axis" checked>
        </label>
        <label class="toggle-row">
            <span>黃道面 (Ecliptic Plane)</span>
            <input type="checkbox" id="chk-ecliptic" checked>
        </label>
        <label class="toggle-row">
            <span>赤道面 (Equatorial Plane)</span>
            <input type="checkbox" id="chk-equator" checked>
        </label>
        <label class="toggle-row">
            <span>月球公轉軌道 (5° 傾角)</span>
            <input type="checkbox" id="chk-moon-orbit" checked>
        </label>
    </div>

    <script>
        // 天體幾何與物理常數
        const AXIAL_TILT = 23.44 * (Math.PI / 180); // 黃赤交角 23.5度 (弧度)
        const MOON_INCLINATION = 5.14 * (Math.PI / 180); // 黃白交角 5.14度
        const EARTH_ORBIT_RADIUS = 55;
        const MOON_ORBIT_RADIUS = 9;

        // 真實世界天體運動週期比率（以「地球日」為單位）
        const PERIOD_EARTH_ROTATION = 1.0;         // 地球自轉週期：1 日
        const PERIOD_MOON_ORBIT = 27.32;           // 月球恆星月週期：27.32 日
        const PERIOD_EARTH_ORBIT = 365.2564;       // 地球公轉恆星年週期：365.2564 日

        // 角速度計算 (rad/day)
        const OMEGA_EARTH_ROT = (2 * Math.PI) / PERIOD_EARTH_ROTATION;
        const OMEGA_MOON_ORBIT = (2 * Math.PI) / PERIOD_MOON_ORBIT;
        const OMEGA_EARTH_ORBIT = (2 * Math.PI) / PERIOD_EARTH_ORBIT;

        const state = {
            isPlaying: true,
            speed: 1.0,
            earthOrbitAngle: Math.PI / 2, // 初始位置設為春分 (0, 0, 55)
            earthRotationAngle: 0,        // 地球自轉角
            moonRelativeAngle: 0,         // 月球相對於「日地連線」的角度 (0 = 朔/初一)
            pipViewMode: 'equator',       // 'north' (北緯45度), 'equator' (赤道), 'south' (南緯45度)
            showEarthPIP: true,
            showMoon: true,
            showPIP: true,
            showAxis: true,
            showEcliptic: true,
            showEquator: true,
            showMoonOrbit: true
        };

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 65, 110);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 月相 PIP 視窗專用 WebGL Renderer & Camera
        const pipCanvas = document.getElementById('moon-pip-canvas');
        const pipRenderer = new THREE.WebGLRenderer({ canvas: pipCanvas, antialias: true });
        pipRenderer.setSize(120, 120);
        const pipCamera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);

        // 地球晝夜視野 PIP 視窗專用 WebGL Renderer & Camera
        const earthPipCanvas = document.getElementById('earth-pip-canvas');
        const earthPipRenderer = new THREE.WebGLRenderer({ canvas: earthPipCanvas, antialias: true });
        earthPipRenderer.setSize(260, 190);
        const earthPipCamera = new THREE.PerspectiveCamera(35, 260 / 190, 0.1, 200);

        function createStarfield() {
            const starGeo = new THREE.BufferGeometry();
            const count = 3000;
            const pos = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i++) {
                pos[i] = (Math.random() - 0.5) * 600;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.8 });
            scene.add(new THREE.Points(starGeo, starMat));
        }
        createStarfield();

        // 太陽光 (PointLight + Ambient)
        const sunLight = new THREE.PointLight(0xffffff, 2.2, 400);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0x222233, 0.25);
        scene.add(ambientLight);

        function generateSunTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(256, 256, 10, 256, 256, 256);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.2, '#fef08a');
            grad.addColorStop(0.6, '#f97316');
            grad.addColorStop(1, '#dc2626');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 512);
            return new THREE.CanvasTexture(canvas);
        }

        function generateEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1e3a8a';
            ctx.fillRect(0, 0, 1024, 512);
            ctx.fillStyle = '#15803d';
            for (let i = 0; i < 40; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 1024, Math.random() * 512, 30 + Math.random() * 90, 0, Math.PI * 2);
                ctx.fill();
            }
            // 赤道線提示標記
            ctx.fillStyle = 'rgba(56, 189, 248, 0.5)';
            ctx.fillRect(0, 254, 1024, 4);

            // 北緯 23.5 度 (北回歸線) 提示虛線
            ctx.fillStyle = 'rgba(239, 68, 68, 0.6)';
            ctx.fillRect(0, 256 - (23.44 / 90) * 256, 1024, 2);

            // 南緯 23.5 度 (南回歸線) 提示虛線
            ctx.fillRect(0, 256 + (23.44 / 90) * 256, 1024, 2);

            // 極地冰冠
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 1024, 30);
            ctx.fillRect(0, 482, 1024, 30);
            return new THREE.CanvasTexture(canvas);
        }

        function generateMoonTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(0, 0, 512, 256);
            ctx.fillStyle = '#64748b';
            for (let i = 0; i < 60; i++) {
                ctx.beginPath();
                ctx.arc(Math.random() * 512, Math.random() * 256, 3 + Math.random() * 12, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        // 1. 太陽 (Sun)
        const sunGeo = new THREE.SphereGeometry(7, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ map: generateSunTexture() });
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        scene.add(sunMesh);

        // 2. 地球組合 (Earth Group & Mesh)
        const earthSystemGroup = new THREE.Group(); // 公轉層
        scene.add(earthSystemGroup);

        const earthTiltGroup = new THREE.Group(); // 地軸黃赤交角層 (傾斜 23.5度 固定指向 Z 軸方向)
        earthTiltGroup.rotation.z = -AXIAL_TILT; 
        earthSystemGroup.add(earthTiltGroup);

        const earthGeo = new THREE.SphereGeometry(3.2, 32, 32);
        const earthMat = new THREE.MeshStandardMaterial({ map: generateEarthTexture(), roughness: 0.6 });
        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        earthMesh.castShadow = true;
        earthMesh.receiveShadow = true;
        earthTiltGroup.add(earthMesh);

        // 3. 月球組合 (Moon Group & Mesh)
        const moonSystemGroup = new THREE.Group(); // 黃白交角 5.14度
        moonSystemGroup.rotation.z = MOON_INCLINATION;
        earthSystemGroup.add(moonSystemGroup);

        const moonGeo = new THREE.SphereGeometry(0.85, 32, 32);
        const moonMat = new THREE.MeshStandardMaterial({ map: generateMoonTexture(), roughness: 0.8 });
        const moonMesh = new THREE.Mesh(moonGeo, moonMat);
        moonMesh.castShadow = true;
        moonMesh.receiveShadow = true;
        moonSystemGroup.add(moonMesh);

        // 輔助線 1: 地球 23.5 度自轉軸
        const axisGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, -7, 0),
            new THREE.Vector3(0, 7, 0)
        ]);
        const axisMat = new THREE.LineBasicMaterial({ color: 0xef4444, linewidth: 2 });
        const earthAxisLine = new THREE.Line(axisGeo, axisMat);
        earthTiltGroup.add(earthAxisLine);

        // 輔助線 2: 赤道面 (Equatorial Plane)
        const equatorGeo = new THREE.RingGeometry(3.22, 5.5, 32);
        const equatorMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.35 });
        const equatorMesh = new THREE.Mesh(equatorGeo, equatorMat);
        equatorMesh.rotation.x = Math.PI / 2;
        earthTiltGroup.add(equatorMesh);

        // 輔助線 3: 黃道面 (Ecliptic Plane)
        const eclipticGeo = new THREE.RingGeometry(0.1, EARTH_ORBIT_RADIUS + 5, 64);
        const eclipticMat = new THREE.MeshBasicMaterial({ color: 0xeab308, side: THREE.DoubleSide, transparent: true, opacity: 0.08 });
        const eclipticMesh = new THREE.Mesh(eclipticGeo, eclipticMat);
        eclipticMesh.rotation.x = Math.PI / 2;
        scene.add(eclipticMesh);

        // 地球公轉軌道線
        const orbitCurve = new THREE.EllipseCurve(0, 0, EARTH_ORBIT_RADIUS, EARTH_ORBIT_RADIUS, 0, 2 * Math.PI);
        const orbitPoints = orbitCurve.getPoints(128);
        const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints.map(p => new THREE.Vector3(p.x, 0, p.y)));
        const orbitLine = new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4 }));
        scene.add(orbitLine);

        // 輔助線 4: 月球公轉軌道面
        const moonOrbitPoints = new THREE.EllipseCurve(0, 0, MOON_ORBIT_RADIUS, MOON_ORBIT_RADIUS, 0, 2 * Math.PI).getPoints(64);
        const moonOrbitGeo = new THREE.BufferGeometry().setFromPoints(moonOrbitPoints.map(p => new THREE.Vector3(p.x, 0, p.y)));
        const moonOrbitLine = new THREE.Line(moonOrbitGeo, new THREE.LineBasicMaterial({ color: 0xfef08a, transparent: true, opacity: 0.6 }));
        moonSystemGroup.add(moonOrbitLine);

        // 更新月相 PIP
        function updateMoonPIP() {
            if (!state.showPIP || !state.showMoon) return;

            let phaseAngle = state.moonRelativeAngle % (2 * Math.PI);
            if (phaseAngle < 0) phaseAngle += 2 * Math.PI;

            const lunarDayNum = Math.floor((phaseAngle / (2 * Math.PI)) * 29.53) + 1;
            const illuminatedPct = Math.round((1 - Math.cos(phaseAngle)) / 2 * 100);

            let dateName = `農曆 第 ${lunarDayNum} 天`;
            let phaseDesc = `照亮比例 ${illuminatedPct}%`;

            if (lunarDayNum === 1) { dateName = '農曆 初一 (朔)'; phaseDesc = '新月 / 位於日地之間'; }
            else if (lunarDayNum >= 7 && lunarDayNum <= 8) { dateName = '農曆 初八 (上弦)'; phaseDesc = '上弦月'; }
            else if (lunarDayNum === 15) { dateName = '農曆 十五 (望)'; phaseDesc = '滿月 / 月食點'; }
            else if (lunarDayNum >= 22 && lunarDayNum <= 23) { dateName = '農曆 廿三 (下弦)'; phaseDesc = '下弦月'; }

            document.getElementById('lunar-date-text').innerText = dateName;
            document.getElementById('lunar-phase-desc').innerText = phaseDesc;

            const moonWorldPos = new THREE.Vector3();
            moonMesh.getWorldPosition(moonWorldPos);
            const earthWorldPos = new THREE.Vector3();
            earthMesh.getWorldPosition(earthWorldPos);

            pipCamera.position.copy(earthWorldPos);
            pipCamera.lookAt(moonWorldPos);

            pipRenderer.render(scene, pipCamera);
        }

        // 更新地球同步衛星視角 PIP
        function updateEarthPIP() {
            if (!state.showEarthPIP) return;

            // 根據視角模式選擇衛星局部座標 (距離地球中心 12 單位)
            // 45度角: rad = 45 * Math.PI / 180, cos(45°)=sin(45°)=0.7071
            const dist = 12;
            const sin45 = Math.sin(Math.PI / 4) * dist; // Y 偏移
            const cos45 = Math.cos(Math.PI / 4) * dist; // Z 偏移

            let satLocalPos = new THREE.Vector3(0, 0, dist);

            if (state.pipViewMode === 'north') {
                satLocalPos.set(0, sin45, cos45); // 北緯 45° 上空
            } else if (state.pipViewMode === 'south') {
                satLocalPos.set(0, -sin45, cos45); // 南緯 45° 上空
            } else {
                satLocalPos.set(0, 0, dist); // 赤道上空
            }

            const earthCenterLocalPos = new THREE.Vector3(0, 0, 0);

            // 將局部座標轉換為世界座標（相機隨著地球轉動與公轉而同步移動）
            const satWorldPos = satLocalPos.applyMatrix4(earthMesh.matrixWorld);
            const earthCenterWorldPos = earthCenterLocalPos.applyMatrix4(earthMesh.matrixWorld);

            // 計算衛星視角方向向量，設置相機上方向與地球自轉軸一致
            const upVector = new THREE.Vector3(0, 1, 0).applyQuaternion(earthMesh.getWorldQuaternion(new THREE.Quaternion()));

            earthPipCamera.position.copy(satWorldPos);
            earthPipCamera.up.copy(upVector);
            earthPipCamera.lookAt(earthCenterWorldPos);

            earthPipRenderer.render(scene, earthPipCamera);

            // 更新直射緯度描述文本
            const angle = state.earthOrbitAngle % (2 * Math.PI);
            let normalizedAngle = angle < 0 ? angle + 2 * Math.PI : angle;
            
            let seasonText = "太陽直射位置：赤道 (春分/秋分)";
            if (Math.abs(normalizedAngle - Math.PI) < 0.2) {
                seasonText = "太陽直射位置：北緯 23.5° (夏至)";
            } else if (normalizedAngle < 0.2 || normalizedAngle > (2 * Math.PI - 0.2)) {
                seasonText = "太陽直射位置：南緯 23.5° (冬至)";
            } else if (Math.abs(normalizedAngle - (3 * Math.PI) / 2) < 0.2) {
                seasonText = "太陽直射位置：赤道 (秋分)";
            } else if (Math.abs(normalizedAngle - Math.PI / 2) < 0.2) {
                seasonText = "太陽直射位置：赤道 (春分)";
            }

            document.getElementById('season-desc-text').innerText = seasonText;
        }

        const panel = document.getElementById('control-panel');
        const toggleBtn = document.getElementById('btn-toggle-panel');
        let isCollapsed = false;

        toggleBtn.addEventListener('click', () => {
            isCollapsed = !isCollapsed;
            panel.classList.toggle('collapsed', isCollapsed);
            document.getElementById('toggle-icon').innerText = isCollapsed ? '⚙️' : '◀';
            document.getElementById('toggle-text').innerText = isCollapsed ? '展開控制選單' : '收合控制選單';
        });

        document.getElementById('btn-play-pause').addEventListener('click', (e) => {
            state.isPlaying = !state.isPlaying;
            e.target.innerText = state.isPlaying ? '暫停 / Pause' : '播放 / Play';
        });

        document.getElementById('btn-reset-cam').addEventListener('click', () => {
            camera.position.set(0, 65, 110);
            controls.target.set(0, 0, 0);
            controls.update();
        });

        document.getElementById('speed-slider').addEventListener('input', (e) => {
            state.speed = parseFloat(e.target.value);
            document.getElementById('speed-val').innerText = `${state.speed.toFixed(1)}x`;
        });

        // 四節氣定位
        document.getElementById('btn-spring').addEventListener('click', () => state.earthOrbitAngle = Math.PI / 2);
        document.getElementById('btn-summer').addEventListener('click', () => state.earthOrbitAngle = Math.PI);
        document.getElementById('btn-autumn').addEventListener('click', () => state.earthOrbitAngle = (3 * Math.PI) / 2);
        document.getElementById('btn-winter').addEventListener('click', () => state.earthOrbitAngle = 0);

        // 同步衛星觀察視角切換邏輯 (同時連動面板與 PIP 小視窗中的按鈕)
        const viewBtns = document.querySelectorAll('.view-btn');
        viewBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const targetView = e.target.getAttribute('data-view');
                state.pipViewMode = targetView;

                // 更新所有對應按鈕的 active 狀態
                viewBtns.forEach(b => {
                    if (b.getAttribute('data-view') === targetView) {
                        b.classList.add('active');
                    } else {
                        b.classList.remove('active');
                    }
                });
            });
        });

        // PIP 與輔助線開關
        const earthPipEl = document.getElementById('earth-pip-window');
        document.getElementById('chk-show-earth-pip').addEventListener('change', (e) => {
            state.showEarthPIP = e.target.checked;
            earthPipEl.classList.toggle('hidden', !e.target.checked);
        });
        document.getElementById('earth-pip-close-btn').addEventListener('click', () => {
            state.showEarthPIP = false;
            document.getElementById('chk-show-earth-pip').checked = false;
            earthPipEl.classList.add('hidden');
        });

        document.getElementById('chk-show-moon').addEventListener('change', (e) => {
            state.showMoon = e.target.checked;
            moonMesh.visible = e.target.checked;
            moonOrbitLine.visible = e.target.checked && state.showMoonOrbit;
        });

        const moonPipEl = document.getElementById('moon-pip-window');
        document.getElementById('chk-show-pip').addEventListener('change', (e) => {
            state.showPIP = e.target.checked;
            moonPipEl.classList.toggle('hidden', !e.target.checked);
        });
        document.getElementById('pip-close-btn').addEventListener('click', () => {
            state.showPIP = false;
            document.getElementById('chk-show-pip').checked = false;
            moonPipEl.classList.add('hidden');
        });

        document.getElementById('chk-earth-axis').addEventListener('change', (e) => earthAxisLine.visible = e.target.checked);
        document.getElementById('chk-ecliptic').addEventListener('change', (e) => eclipticMesh.visible = e.target.checked);
        document.getElementById('chk-equator').addEventListener('change', (e) => equatorMesh.visible = e.target.checked);
        document.getElementById('chk-moon-orbit').addEventListener('change', (e) => moonOrbitLine.visible = e.target.checked);

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (state.isPlaying) {
                const simDaysPassed = delta * 5.0 * state.speed;

                state.earthOrbitAngle += OMEGA_EARTH_ORBIT * simDaysPassed;
                state.earthRotationAngle += OMEGA_EARTH_ROT * simDaysPassed;
                state.moonRelativeAngle += (OMEGA_MOON_ORBIT - OMEGA_EARTH_ORBIT) * simDaysPassed;
            }

            // 1. 更新地球公轉座標
            earthSystemGroup.position.x = Math.cos(state.earthOrbitAngle) * EARTH_ORBIT_RADIUS;
            earthSystemGroup.position.z = Math.sin(state.earthOrbitAngle) * EARTH_ORBIT_RADIUS;

            // 2. 地球自轉 (保持 23.5度地軸傾角)
            earthMesh.rotation.y = state.earthRotationAngle;

            // 3. 更新月球位置 (初一對齊日地連線)
            if (state.showMoon) {
                const moonAbsoluteAngle = state.earthOrbitAngle + Math.PI + state.moonRelativeAngle;
                moonMesh.position.x = Math.cos(moonAbsoluteAngle) * MOON_ORBIT_RADIUS;
                moonMesh.position.z = Math.sin(moonAbsoluteAngle) * MOON_ORBIT_RADIUS;
            }

            // 4. 更新 PIP 子視窗渲染
            updateMoonPIP();
            updateEarthPIP();

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
